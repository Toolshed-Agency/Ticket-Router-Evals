[project]
name = "ticket-router-evals"
version = "0.1.0"
description = "An open-source exam for an AI support-ticket router, with every score published."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout with three top-level packages (plan P1-D1). harness/ is the general machinery;
# router/ and evals/ are the Ledgerly-specific parts (spec D1, section 5).
module-root = ""
module-name = ["harness", "router", "evals"]

[dependency-groups]
dev = ["pytest==9.2.0"]
